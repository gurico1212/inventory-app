<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>レシピ要約アプリ</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --primary: #ff6b35;
      --primary-dark: #e55a26;
      --bg: #faf8f5;
      --card: #ffffff;
      --text: #2d2d2d;
      --muted: #888;
      --border: #e8e3dc;
      --radius: 16px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    .header {
      background: var(--primary);
      color: white;
      padding: 20px 20px 24px;
      text-align: center;
    }

    .header h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .header p {
      font-size: 13px;
      opacity: 0.85;
      margin-top: 4px;
    }

    .main {
      padding: 20px 16px;
      max-width: 680px;
      margin: 0 auto;
    }

    .input-card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.07);
      margin-bottom: 20px;
    }

    .input-card label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .input-row {
      display: flex;
      gap: 10px;
    }

    .url-input {
      flex: 1;
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 16px; /* 16px 以上でiOSのズームを防ぐ */
      color: var(--text);
      background: var(--bg);
      outline: none;
      transition: border-color 0.2s;
      -webkit-appearance: none;
    }

    .url-input:focus {
      border-color: var(--primary);
    }

    .url-input::placeholder {
      color: #bbb;
    }

    .submit-btn {
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 14px 20px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s, transform 0.1s;
      -webkit-tap-highlight-color: transparent;
    }

    .submit-btn:active {
      background: var(--primary-dark);
      transform: scale(0.97);
    }

    .submit-btn:disabled {
      background: #ccc;
      cursor: not-allowed;
      transform: none;
    }

    .result-card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.07);
      display: none;
    }

    .result-card.visible {
      display: block;
    }

    .result-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .result-header span {
      font-size: 14px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .loading-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      background: var(--primary);
      border-radius: 50%;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .result-text {
      font-size: 15px;
      line-height: 1.8;
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* Markdown 風のスタイル */
    .result-text .h1 {
      font-size: 20px;
      font-weight: 700;
      color: var(--primary);
      margin: 0 0 12px;
    }

    .result-text .h2 {
      font-size: 16px;
      font-weight: 700;
      margin: 20px 0 8px;
      padding-bottom: 4px;
      border-bottom: 2px solid var(--border);
    }

    .error-msg {
      color: #e53e3e;
      font-size: 14px;
      background: #fff5f5;
      border: 1px solid #feb2b2;
      border-radius: 8px;
      padding: 12px;
    }

    .hint {
      font-size: 12px;
      color: var(--muted);
      margin-top: 10px;
      line-height: 1.5;
    }

    .hint a {
      color: var(--primary);
      text-decoration: none;
    }

    @media (max-width: 400px) {
      .input-row {
        flex-direction: column;
      }
      .submit-btn {
        width: 100%;
        padding: 16px;
        font-size: 16px;
      }
    }
  </style>
</head>
<body>

<div class="header">
  <h1>🍳 レシピ要約アプリ</h1>
  <p>料理レシピページのURLを貼り付けるだけで要約します</p>
</div>

<div class="main">
  <div class="input-card">
    <label>レシピページのURL</label>
    <div class="input-row">
      <input
        type="url"
        class="url-input"
        id="urlInput"
        placeholder="https://www.kurashiru.com/recipes/..."
        inputmode="url"
        autocomplete="off"
        autocorrect="off"
        autocapitalize="none"
        spellcheck="false"
      >
      <button class="submit-btn" id="submitBtn" onclick="startSummarize()">
        要約する
      </button>
    </div>
    <p class="hint">
      クックパッド・クラシル・デリッシュキッチンなど主要レシピサイトに対応
    </p>
  </div>

  <div class="result-card" id="resultCard">
    <div class="result-header">
      <div class="loading-dot" id="loadingDot" style="display:none"></div>
      <span id="resultLabel">要約結果</span>
    </div>
    <div class="result-text" id="resultText"></div>
  </div>
</div>

<script>
  let controller = null;

  // テキストを簡易的に HTML レンダリング
  function renderMarkdown(text) {
    return text
      .replace(/^# (.+)$/gm, '<div class="h1">$1</div>')
      .replace(/^## (.+)$/gm, '<div class="h2">$1</div>');
  }

  async function startSummarize() {
    const url = document.getElementById('urlInput').value.trim();
    if (!url) {
      alert('URLを入力してください');
      return;
    }

    // 前のリクエストをキャンセル
    if (controller) controller.abort();
    controller = new AbortController();

    const btn = document.getElementById('submitBtn');
    const resultCard = document.getElementById('resultCard');
    const resultText = document.getElementById('resultText');
    const loadingDot = document.getElementById('loadingDot');
    const resultLabel = document.getElementById('resultLabel');

    btn.disabled = true;
    btn.textContent = '要約中...';
    resultCard.classList.add('visible');
    resultText.innerHTML = '';
    loadingDot.style.display = 'inline-block';
    resultLabel.textContent = 'Claude が要約中...';

    let rawText = '';

    try {
      const encodedUrl = encodeURIComponent(url);
      const response = await fetch(`/summarize?url=${encodedUrl}`, {
        signal: controller.signal,
      });

      const reader = response.body.getReader();
      const decoder = new TextDecoder();

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        const chunk = decoder.decode(value, { stream: true });
        const lines = chunk.split('\n');

        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          const data = line.slice(6);

          if (data === '[DONE]') {
            loadingDot.style.display = 'none';
            resultLabel.textContent = '要約完了';
            break;
          }

          if (data.startsWith('ERROR: ')) {
            resultText.innerHTML = `<div class="error-msg">${data.slice(7)}</div>`;
            loadingDot.style.display = 'none';
            resultLabel.textContent = 'エラー';
            break;
          }

          // エスケープされた改行を戻す
          rawText += data.replace(/\\n/g, '\n');
          resultText.innerHTML = renderMarkdown(rawText);

          // 自動スクロール
          resultText.scrollIntoView({ behavior: 'smooth', block: 'end' });
        }
      }
    } catch (err) {
      if (err.name !== 'AbortError') {
        resultText.innerHTML = '<div class="error-msg">通信エラーが発生しました。再度お試しください。</div>';
        loadingDot.style.display = 'none';
        resultLabel.textContent = 'エラー';
      }
    } finally {
      btn.disabled = false;
      btn.textContent = '要約する';
    }
  }

  // Enter キーでも送信
  document.getElementById('urlInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') startSummarize();
  });
</script>

</body>
</html>
